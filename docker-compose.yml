services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: futbolica
      POSTGRES_USER: futbolica
      POSTGRES_PASSWORD: futbolica
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futbolica -d futbolica"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: